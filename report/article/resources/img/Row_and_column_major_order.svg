<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="100%" height="100%" viewBox="-240 -190 480 640">
 <title>Row and column major order</title>
 <desc>Illustration of row- and column-major order by CMG Lee.</desc>
 <defs>
  <path id="arrowhead" d="M -20,30 L 0,0 L 20,30"/>
  <g id="arrow_row">
   <path d="M -120,-80 H 120 L -120,0 H 120 L -120,80 H 120"/>
   <use xlink:href="#arrowhead" transform="translate(120,80) rotate(90)"/>
  </g>
  <g id="arrow_column">
   <path d="M -120,-80 V 80 L 0,-80 V 80 L 120,-80 V 80"/>
   <use xlink:href="#arrowhead" transform="translate(120,80) rotate(180)"/>
  </g>
  <path id="bracket" d="M -180,-110 h -20 v 210 h 20" stroke-width="2" stroke="#000000"/>
  <g id="common">
   <use xlink:href="#bracket"/>
   <use xlink:href="#bracket" transform="scale(-1,1)"/>
   <g fill="#000000">
    <switch><text x="-120" y="-80" id="trsvg21"><tspan font-style="italic" id="trsvg1">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg2">11</tspan></text></switch>
    <switch><text x="0" y="-80" id="trsvg22"><tspan font-style="italic" id="trsvg3">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg4">12</tspan></text></switch>
    <switch><text x="120" y="-80" id="trsvg23"><tspan font-style="italic" id="trsvg5">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg6">13</tspan></text></switch>
    <switch><text x="-120" y="0" id="trsvg24"><tspan font-style="italic" id="trsvg7">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg8">21</tspan></text></switch>
    <switch><text x="0" y="0" id="trsvg25"><tspan font-style="italic" id="trsvg9">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg10">22</tspan></text></switch>
    <switch><text x="120" y="0" id="trsvg26"><tspan font-style="italic" id="trsvg11">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg12">23</tspan></text></switch>
    <switch><text x="-120" y="80" id="trsvg27"><tspan font-style="italic" id="trsvg13">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg14">31</tspan></text></switch>
    <switch><text x="0" y="80" id="trsvg28"><tspan font-style="italic" id="trsvg15">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg16">32</tspan></text></switch>
    <switch><text x="120" y="80" id="trsvg29"><tspan font-style="italic" id="trsvg17">a</tspan><tspan font-size="75%" dy="1ex" id="trsvg18">33</tspan></text></switch>
   </g>
  </g>
 </defs>
 <circle cx="0" cy="0" r="99999" fill="#ffffff"/>
 <g font-family="Liberation Sans,Helvetica,Arial,sans-serif" font-size="50" text-anchor="middle" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" stroke="none" fill="none">
  <g transform="translate(0,0)">
   <switch><text x="0" y="-160" dy="0.7ex" fill="#000000" id="trsvg30-pt-br" systemLanguage="pt-br"><tspan id="trsvg19-pt-br">Ordem por linha</tspan></text><text x="0" y="-160" dy="0.7ex" fill="#000000" id="trsvg30"><tspan id="trsvg19">Row-major order</tspan></text></switch>
   <use xlink:href="#arrow_row" stroke="#ff6666"/>
   <use xlink:href="#common"/>
  </g>
  <g transform="translate(0,330)">
   <switch><text x="0" y="-160" dy="0.7ex" fill="#000000" id="trsvg31-pt-br" systemLanguage="pt-br"><tspan id="trsvg20-pt-br">Ordem por coluna</tspan></text><text x="0" y="-160" dy="0.7ex" fill="#000000" id="trsvg31"><tspan id="trsvg20">Column-major order</tspan></text></switch>
   <use xlink:href="#arrow_column" stroke="#00cccc"/>
   <use xlink:href="#common"/>
  </g>
 </g>
</svg>
